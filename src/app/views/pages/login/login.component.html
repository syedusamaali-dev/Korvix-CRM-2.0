<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>

      <!-- Login Card -->
      <c-card class="p-4">
        <c-card-body>

          <form cForm (ngSubmit)="login()">

            <h1>Login</h1>

            <p class="text-body-secondary">
              Sign In to your account
            </p>
            <p class="text-body-secondary">
              Testing ID: test@gmail.com
            </p>
             <p class="text-body-secondary">
              Testing Password: admin123
            </p>
            

            <!-- Error Message -->
            <div
              *ngIf="errorMessage"
              class="alert alert-danger"
              role="alert"
            >
              {{ errorMessage }}
            </div>

            <!-- Email -->
            <c-input-group class="mb-3">
              <span cInputGroupText>
                <svg cIcon name="cilUser"></svg>
              </span>

              <input
                autoComplete="username"
                cFormControl
                placeholder="Email"
                type="email"
                [(ngModel)]="email"
                name="email"
                required
              />
            </c-input-group>

            <!-- Password -->
            <c-input-group class="mb-4">
              <span cInputGroupText>
                <svg cIcon name="cilLockLocked"></svg>
              </span>

              <input
                autoComplete="current-password"
                cFormControl
                placeholder="Password"
                type="password"
                [(ngModel)]="password"
                name="password"
                required
              />
            </c-input-group>

            <!-- Actions -->
            <c-row>

              <c-col xs="6">
                <button
                  cButton
                  class="px-4"
                  color="primary"
                  type="submit"
                  [disabled]="loading"
                >
                  {{ loading ? 'Logging in...' : 'Login' }}
                </button>
              </c-col>

              <c-col class="text-end" xs="6">
                <button
                  cButton
                  class="px-0"
                  color="link"
                  type="button"
                >
                  Forgot password?
                </button>
              </c-col>

            </c-row>

          </form>

        </c-card-body>
      </c-card>

      <!-- Register Card -->
      <c-card
        [style.minWidth.%]="44"
        class="text-white bg-primary py-5"
      >
        <c-card-body class="text-center">

          <div>

            <h2>Sign up</h2>

            <p>
              Create your Korvix CRM account and start managing
              customers, leads, companies, contacts, deals and tasks
              from one place.
            </p>

            <button
              [active]="true"
              cButton
              class="mt-3"
              color="primary"
              type="button"
              routerLink="/register"
            >
              Register Now!
            </button>

          </div>

        </c-card-body>
      </c-card>

    </c-card-group>
  </c-col>
</c-row>

  </c-container>
</div>
